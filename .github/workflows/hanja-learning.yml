name: Hanja Learning Scheduler

on:
  schedule:
    # UTC 기준 → KST 오전 7시47분/오전 9시47분/오전 11시47분
    - cron: '47 22 * * *'   # 오전 7시47분 (전날 UTC 22:47)
    - cron: '47 0 * * *'    # 오전 9시47분
    - cron: '47 2 * * *'    # 오전 11시47분

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Determine slot from trigger time
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '47 22 * * *') echo "slot=review_hanja" >> "$GITHUB_OUTPUT" ;;
            '47 0 * * *') echo "slot=review_eumhun" >> "$GITHUB_OUTPUT" ;;
            '47 2 * * *') echo "slot=new_hanja" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=all" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Send Telegram Message
        run: python script/telegram_send.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
