name: Hanja Learning Scheduler

on:
  schedule:
    # UTC 기준 → KST 오전 9시/오후 3시/오후 6시
    - cron: '0 0 * * *'   # 오전 9시
    - cron: '0 6 * * *'   # 오후 3시
    - cron: '0 9 * * *'   # 오후 6시

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Determine slot from trigger time
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '0 0 * * *') echo "slot=review_hanja" >> "$GITHUB_OUTPUT" ;;
            '0 6 * * *') echo "slot=review_eumhun" >> "$GITHUB_OUTPUT" ;;
            '0 9 * * *') echo "slot=new_hanja" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=all" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Send Telegram Message
        run: python script/telegram_send.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
